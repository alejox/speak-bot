<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Escribe o toca una frase y deja que tu teléfono hable por ti." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171b22" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />
    <title>Speed Deck</title>
    <script>
      // Applies the stored theme and text size before the first paint, so the page never flashes the
      // other theme. Mirrors LocalStorageAppearanceStore and applyAppearance, which take over once the app loads.
      try {
        var stored = JSON.parse(localStorage.getItem("speed-deck:appearance") || "null") || {};
        var root = document.documentElement;
        if (stored.theme === "light" || stored.theme === "dark") root.setAttribute("data-theme", stored.theme);
        if (stored.textSize === "large" || stored.textSize === "extra-large") root.setAttribute("data-text-size", stored.textSize);
      } catch (error) {
        // Storage blocked or unreadable: the defaults apply.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
