# Installers for macOS, Windows and Linux. Built by .github/workflows/release.yml on v* tags.
# The apps are not code-signed: see the README for the Gatekeeper and SmartScreen warnings.
appId: io.github.alejox.speeddeck
productName: Speed Deck
artifactName: speed-deck-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
# Everything the main process needs is bundled into dist/main.cjs, so no node_modules ship.
files:
  - package.json
  - dist/**
  - "!dist/**/*.map"
  - assets/**
extraResources:
  - from: ../mobile/dist
    to: mobile
  - from: ../desktop/public/overlay.html
    to: overlay.html
  # The licences of the open-source software in the app, written by the web build (scripts/third-party-notices.mjs).
  # It is also inside mobile/, from where the app shows it in Settings → Open-source licences.
  - from: ../mobile/dist/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
npmRebuild: false
# Where the installed app looks for new versions: electron-builder embeds this as app-update.yml and writes
# the update metadata (latest.yml, latest-mac.yml, latest-linux.yml) and blockmaps next to the installers.
# Nothing is uploaded from here: the release workflow builds with --publish never and attaches the files itself.
publish:
  provider: github
  owner: alejox
  repo: speak-bot
  releaseType: release

mac:
  category: public.app-category.utilities
  # No Apple Developer ID, so no notarization. "-" signs ad hoc: an unsigned Apple Silicon app
  # is reported as "damaged" instead of showing the usual "unidentified developer" prompt.
  identity: "-"
  # Only needed for notarization; with ad-hoc signing it would block loading Electron's frameworks.
  hardenedRuntime: false
  # One universal app for Apple Silicon and Intel, so nobody can pick the wrong download. An Intel
  # build on an Apple Silicon Mac runs under Rosetta, which macOS reports as ending support.
  target:
    - target: dmg
      arch: [universal]

win:
  target:
    - target: nsis
      arch: [x64]

# Microsoft Store package (MSIX), built only by `npm run dist:store` (or .github/workflows/store.yml): the Store
# signs it, so Windows shows no SmartScreen warning. Its identity (identityName, publisher, publisherDisplayName)
# comes from Partner Center and is passed by scripts/dist-store.mjs. Tile images are in build/appx.
appx:
  applicationId: SpeedDeck
  displayName: Speed Deck
  backgroundColor: "#111318"
  languages: [es-ES, en-US]
  artifactName: speed-deck-${version}-store.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  executableName: speed-deck
  category: Utility
  synopsis: Speak typed phrases out loud and show captions in OBS
  maintainer: alejox <alejox@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
