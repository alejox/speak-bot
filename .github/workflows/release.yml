name: Release

# Builds the desktop installers on each OS and attaches them to the GitHub Release for the tag, together with
# the update metadata (latest.yml, latest-mac.yml, latest-linux.yml) and blockmaps the installed apps read to
# find and download a new version. The tag is the version: v1.2.3 publishes Speed Deck 1.2.3.
# Run it by hand (workflow_dispatch) to get the installers as build artifacts without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    env:
      # The apps are not signed with a developer certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pick the app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - run: npm run build -w @speed-deck/mobile
      - run: npm run build -w @speed-deck/electron
      - name: Build installers
        shell: bash
        working-directory: apps/electron
        run: npx electron-builder ${{ matrix.target }} --publish never "-c.extraMetadata.version=$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.exe
            apps/electron/release/*.AppImage
            apps/electron/release/*.deb
            apps/electron/release/latest*.yml
            apps/electron/release/*.blockmap
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: installers
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # One folder per OS job, so a file name two jobs share is noticed instead of one silently replacing the other.
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
      - name: Check the files to publish
        shell: bash
        run: |
          find installers -type f | sort
          duplicates="$(find installers -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Two OS jobs produced a file with the same name: $duplicates"
            exit 1
          fi
          # Without these the installed apps cannot find this release.
          for metadata in latest.yml latest-mac.yml latest-linux.yml; do
            if [[ -z "$(find installers -type f -name "$metadata")" ]]; then
              echo "::error::Missing update metadata: $metadata"
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/*/*
